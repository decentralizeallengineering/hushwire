[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hushwire"
version = "0.1.0"
description = "Fewer cross-session messages for Claude Code: a SendMessage hook, a note digest and message stats"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.scripts]
hushwire = "hushwire.cli:main"

[tool.setuptools]
packages = ["hushwire"]
